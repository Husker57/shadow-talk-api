<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk · Shadow Realm</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#121212; color:#f3f3f3; }
    header, main { max-width:1100px; margin:0 auto; padding:16px; }
    a { color:#c9a227; }
    .row, .who { display:flex; gap:8px; flex-wrap:wrap; }
    button, input { font:inherit; }
    button { background:#c9a227; color:#111; border:0; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:700; }
    button.ghost { background:#2a2a2a; color:#fff; }
    input { background:#111; color:#fff; border:1px solid #333; padding:10px 12px; border-radius:8px; }
    .who button[aria-pressed="true"] { outline:2px solid #c9a227; }
    video { width:100%; min-height:360px; background:#000; border-radius:16px; object-fit:cover; }
    .status, .note { color:#9a9a9a; }
  </style>
</head>
<body>
  <header>
    <p><a href="index.html">Home</a> · <a href="account.html">Account</a></p>
    <h1>The Desk</h1>
    <p class="note" id="whoami">Checking account…</p>
  </header>
  <main>
    <div class="who" id="who">
      <button type="button" data-who="lenai">Lenai</button>
      <button type="button" data-who="victor">Victor</button>
      <button type="button" data-who="elena">Elena</button>
      <button type="button" data-who="damian" aria-pressed="true">Damian</button>
    </div>
    <div class="row">
      <button id="start" type="button">Start video</button>
      <button id="stop" class="ghost" type="button">Stop</button>
    </div>
    <p class="status" id="status">Log in first if this page asks you to.</p>
    <video id="avatar" autoplay playsinline></video>
  </main>
<script>
const API = "https://shadow-talk-api.spring-fog-46d4.workers.dev";
let character = "damian";
let room;
let email = localStorage.getItem("shadow_email") || "";

document.getElementById("who").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-who]");
  if (!btn) return;
  character = btn.dataset.who;
  document.querySelectorAll("#who button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
});

(async () => {
  const token = localStorage.getItem("shadow_token") || "";
  const me = token ? await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "me", token })
  }).then((r) => r.json()).catch(() => ({})) : {};
  if (me.ok && me.email) {
    email = me.email;
    localStorage.setItem("shadow_email", email);
    document.getElementById("whoami").textContent = "Signed in as " + email;
  } else {
    document.getElementById("whoami").innerHTML = 'Not signed in. <a href="account.html">Create account or log in</a>';
  }
})();

document.getElementById("start").onclick = async () => {
  const status = document.getElementById("status");
  if (!email) { status.textContent = "Log in first."; return; }
  status.textContent = "Minting session for " + character + "…";
  try {
    if (room) { await room.disconnect(); room = null; }
    const minted = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "session-start", email, character })
    }).then((r) => r.json());
    if (!minted.ok) throw new Error(minted.error || JSON.stringify(minted));
    const reused = minted.reusedMemory ? " Memory reused." : " First saved session.";
    const token = minted.liveavatar?.data?.session_token;
    if (!token) throw new Error("No session_token");
    const started = await fetch("https://api.liveavatar.com/v1/sessions/start", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, Accept: "application/json" }
    }).then((r) => r.json());
    const data = started.data || started;
    const url = data.livekit_url || data.ws_url;
    const lkToken = data.livekit_client_token;
    if (!url || !lkToken) throw new Error(JSON.stringify(started));
    const LK = window.LivekitClient;
    room = new LK.Room({ adaptiveStream: true, dynacast: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video") track.attach(document.getElementById("avatar"));
    });
    await room.connect(url, lkToken);
    await room.localParticipant.setMicrophoneEnabled(true);
    status.textContent = character + " is live." + reused;
  } catch (err) {
    status.textContent = String(err.message || err);
  }
};

document.getElementById("stop").onclick = async () => {
  if (room) { await room.disconnect(); room = null; }
  document.getElementById("status").textContent = "Stopped.";
};
</script>
</body>
</html>
