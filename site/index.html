<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shadow Realm</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#121212; color:#f3f3f3; }
    header, main { max-width:900px; margin:0 auto; padding:20px; }
    a { color:#c9a227; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .card { background:#1c1c1c; padding:16px; border-radius:12px; }
    .note { color:#9a9a9a; }
  </style>
</head>
<body>
  <header>
    <h1>Shadow Realm</h1>
    <p>Four desks. One member account. The room remembers you.</p>
    <p><a href="account.html">Log in / create account</a> · <a href="talk.html">Open the desk</a></p>
  </header>
  <main>
    <div class="cards">
      <div class="card"><b>Lenai</b><br />Read the room.</div>
      <div class="card"><b>Victor</b><br />Cut the noise.</div>
      <div class="card"><b>Elena</b><br />Track the risk.</div>
      <div class="card"><b>Damian</b><br />Call the next move.</div>
    </div>
    <p class="note">Entertainment and information only. No betting.</p>
  </main>
</body>
</html>
