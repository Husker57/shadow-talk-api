<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shadow Realm Desk</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root { --bg:#121212; --panel:#1c1c1c; --gold:#c9a227; --text:#f3f3f3; --muted:#9a9a9a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 20px; border-bottom:1px solid #2a2a2a; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    h1 { margin:0; font-size:1.1rem; letter-spacing:.04em; }
    main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    button, input, select { font: inherit; }
    button { background:var(--gold); color:#111; border:0; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:700; }
    button.ghost { background:#2a2a2a; color:var(--text); }
    input, select { background:#111; color:var(--text); border:1px solid #333; padding:10px 12px; border-radius:8px; min-width:220px; }
    .who { display:flex; gap:8px; flex-wrap:wrap; }
    .who button[aria-pressed="true"] { outline:2px solid var(--gold); }
    .stage { background:#000; border-radius:16px; min-height:360px; overflow:hidden; position:relative; }
    video { width:100%; height:100%; min-height:360px; object-fit:cover; background:#000; }
    .status { color:var(--muted); font-size:.95rem; min-height:1.4em; }
    .note { color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>SHADOW REALM DESK</h1>
    <span class="note">Entertainment only. Not financial advice.</span>
  </header>
  <main>
    <div class="who" id="who">
      <button type="button" data-who="lenai" aria-pressed="false">Lenai</button>
      <button type="button" data-who="victor" aria-pressed="false">Victor</button>
      <button type="button" data-who="elena" aria-pressed="false">Elena</button>
      <button type="button" data-who="damian" aria-pressed="true">Damian</button>
    </div>
    <div class="row">
      <input id="email" type="email" placeholder="Member email" value="test@realm-studios.ai" />
      <button id="start" type="button">Start video</button>
      <button id="stop" class="ghost" type="button">Stop</button>
    </div>
    <p class="status" id="status">Pick a character, then Start video.</p>
    <div class="stage"><video id="avatar" autoplay playsinline></video></div>
  </main>
<script>
const API = "https://shadow-talk-api.spring-fog-46d4.workers.dev";
let character = "damian";
let room;

document.getElementById("who").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-who]");
  if (!btn) return;
  character = btn.dataset.who;
  document.querySelectorAll("#who button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
});

document.getElementById("start").onclick = async () => {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const status = document.getElementById("status");
  if (!email) { status.textContent = "Enter the member email."; return; }
  status.textContent = "Minting session for " + character + "…";
  try {
    if (room) { await room.disconnect(); room = null; }
    const minted = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "session-start", email, character })
    }).then((r) => r.json());
    if (!minted.ok) throw new Error(JSON.stringify(minted));
    const token = minted.liveavatar?.data?.session_token;
    if (!token) throw new Error("No session_token");
    status.textContent = "Starting room…";
    const started = await fetch("https://api.liveavatar.com/v1/sessions/start", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, Accept: "application/json" }
    }).then((r) => r.json());
    const data = started.data || started;
    const url = data.livekit_url || data.ws_url;
    const lkToken = data.livekit_client_token;
    if (!url || !lkToken) throw new Error(JSON.stringify(started));
    const LK = window.LivekitClient;
    room = new LK.Room({ adaptiveStream: true, dynacast: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video") track.attach(document.getElementById("avatar"));
    });
    await room.connect(url, lkToken);
    await room.localParticipant.setMicrophoneEnabled(true);
    status.textContent = character + " is live. Speak or wait for the avatar.";
  } catch (err) {
    status.textContent = String(err.message || err);
  }
};

document.getElementById("stop").onclick = async () => {
  if (room) { await room.disconnect(); room = null; }
  document.getElementById("status").textContent = "Stopped.";
};
</script>
</body>
</html>
